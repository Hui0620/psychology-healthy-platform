name: Frontend Build

on:
  push:
    branches: [main, master]
    paths:
      - "platform-frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "platform-frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-frontend-dist
          path: platform-frontend/dist
          retention-days: 7
